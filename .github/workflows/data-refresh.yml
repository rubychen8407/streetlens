name: Data refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '20 19 * * *' # 03:20 Asia/Taipei (UTC+8)

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh persisted source snapshots
        env:
          STREETLENS_BASE_URL: ${{ secrets.STREETLENS_BASE_URL }}
          STREETLENS_REFRESH_TOKEN: ${{ secrets.STREETLENS_REFRESH_TOKEN }}
        run: npm run refresh:data
