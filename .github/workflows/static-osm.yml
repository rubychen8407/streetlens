name: Weekly static OSM fallback
on:
  push:
    branches: [main]
    paths:
      - scripts/extract-static-osm.py
      - streetGeometryStore.ts
      - .github/workflows/static-osm.yml
  schedule:
    - cron: '45 18 * * 0' # Monday 02:45 Taipei
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: streetlens-static-osm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install osmium==4.3.1 shapely==2.1.2
      - name: Download source outside Render and Neon
        run: |
          curl --location --fail --retry 3 --max-time 600 -D /tmp/osm-headers -o /tmp/taiwan.osm.pbf https://download.geofabrik.de/asia/taiwan-latest.osm.pbf
          test "$(stat -c%s /tmp/taiwan.osm.pbf)" -lt 500000000
          python - <<'PY'
          from email.utils import parsedate_to_datetime
          from pathlib import Path
          rows = Path('/tmp/osm-headers').read_text().splitlines()
          value = next(row.split(':', 1)[1].strip() for row in reversed(rows) if row.lower().startswith('last-modified:'))
          Path('/tmp/osm-time').write_text(parsedate_to_datetime(value).isoformat())
          PY
      - name: Extract Taipei amenities, parks and actual road geometry
        run: python scripts/extract-static-osm.py /tmp/taiwan.osm.pbf /tmp/static-osm.json "$(cat /tmp/osm-time)"
      - name: Import compact evidence inventory
        env:
          STREETLENS_BASE_URL: ${{ secrets.STREETLENS_REFRESH_URL || secrets.STREETLENS_BASE_URL }}
          STREETLENS_REFRESH_TOKEN: ${{ secrets.STREETLENS_REFRESH_TOKEN }}
        run: node --import tsx scripts/import-static-osm.ts /tmp/static-osm.json
      - name: Backfill saved assessments
        env:
          STREETLENS_REFRESH_URL: ${{ secrets.STREETLENS_REFRESH_URL || secrets.STREETLENS_BASE_URL }}
          STREETLENS_REFRESH_TOKEN: ${{ secrets.STREETLENS_REFRESH_TOKEN }}
        run: npm run backfill:scores
