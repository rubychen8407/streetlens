name: Refresh residential transactions
on:
  workflow_dispatch:
    inputs:
      history_years:
        description: First import historical years; scheduled runs only fetch current releases
        type: choice
        options: ['0', '1', '3', '5']
        default: '3'
  schedule:
    - cron: '30 2 1,11,21 * *'
concurrency:
  group: streetlens-housing-import
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/import-housing.py --history-years "$HOUSING_HISTORY_YEARS"
        env:
          HOUSING_HISTORY_YEARS: ${{ inputs.history_years || '0' }}
          STREETLENS_REFRESH_URL: ${{ secrets.STREETLENS_REFRESH_URL || secrets.STREETLENS_BASE_URL }}
          STREETLENS_REFRESH_TOKEN: ${{ secrets.STREETLENS_REFRESH_TOKEN }}
