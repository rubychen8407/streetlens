name: External data health

on:
  push:
    branches:
      - refactor/data-integrity-and-security
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Lint
        run: npm run lint
      - name: Score integrity tests
        run: npm run test:score-integrity
      - name: Assessment snapshot policy tests
        run: npm run test:assessment-policy
      - name: Snapshot preservation tests
        run: npm run test:snapshot-preservation
      - name: Check official external resources
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: npm run check:external-data
