name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - refactor/data-integrity-and-security
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Score integrity tests
        run: npm run test:score-integrity

      - name: Assessment snapshot policy tests
        run: npm run test:assessment-policy

      - name: Snapshot preservation tests
        run: npm run test:snapshot-preservation
