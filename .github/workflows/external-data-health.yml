name: External data health

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - refactor/data-integrity-and-security
    paths:
      - "server.ts"
      - "db.ts"
      - "scoring.ts"
      - "transit.ts"
      - "scripts/check-external-data.ts"
      - "src/dataSources/**"
      - ".github/workflows/external-data-health.yml"

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check official external resources
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: npm run check:external-data
