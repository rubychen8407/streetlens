name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Score integrity tests
        run: npm run test:score-integrity

      - name: Unified street baseline tests
        run: npm run test:unified-baseline

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static OSM extraction tests
        run: |
          pip install osmium==4.3.1 shapely==2.1.2
          python scripts/test-static-osm.py

      - name: Source fallback tests
        run: npm run test:source-fallbacks && npm run test:static-import-api

      - name: Assessment snapshot policy tests
        run: npm run test:assessment-policy

      - name: Storage and safe write tests
        run: npm run test:photo-storage && npm run test:safe-writes && npm run test:storage-budget && npm run test:scheduled-backfill

      - name: Snapshot preservation tests
        run: npm run test:snapshot-preservation

      - name: Optional PostGIS compatibility tests
        run: npm run test:postgis-optional

      - name: Spatial inventory and refresh client regression tests
        run: npm run test:spatial-inventory && npm run test:refresh-client

      - name: WheelRoute sidewalk parsing tests
        run: npm run test:wheelroute-parser

      - name: Walk and saved CLS regression tests
        run: npm run test:walk-moments

      - name: Language and AI explanation tests
        run: npm run test:language

      - name: Install browser for interaction tests
        run: npx playwright install --with-deps chromium --only-shell

      - name: Walk browser tests
        run: npm run test:walk-ui
